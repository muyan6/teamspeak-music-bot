# TSMusicBot — Docker Compose
# 一键部署：docker compose pull && docker compose up -d

services:
  tsmusicbot-custom:
    image: ghcr.1ms.run/muyan6/teamspeak-music-bot:latest
    container_name: tsmusicbot-custom
    # 使用 host 网络模式，方便机器人连接部署在同机的 TS3 服务端
    network_mode: host
    # 如果不用 host 模式（例如 3000 端口已被旧容器占用，可映射到其他端口如 3001）：
    # ports:
    #   - "3001:3000"
    volumes:
      - tsmusicbot-custom-data:/app/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production

volumes:
  tsmusicbot-custom-data:
    driver: local
