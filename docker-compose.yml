# TSMusicBot — Docker Compose
# 一键部署：docker compose pull && docker compose up -d

services:
  tsmusicbot-custom:
    image: ghcr.nju.edu.cn/muyan6/teamspeak-music-bot:latest
    container_name: tsmusicbot-custom
    # 使用 host 网络模式，方便机器人连接部署在同机的 TS3 服务端
    network_mode: host
    # 如果不用 host 模式（例如 3000 端口已被旧容器占用，可映射到其他端口如 3001）：
    # ports:
    #   - "3001:3000"
    volumes:
      - /data/musicbot:/app/data   # 将数据直接保存在宿主机的 /data/musicbot 文件夹
    restart: unless-stopped
    environment:
      - NODE_ENV=production
